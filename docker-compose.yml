services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fastpay
      POSTGRES_PASSWORD: fastpay
      POSTGRES_DB: fastpay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastpay"]
      interval: 5s
      timeout: 5s
      retries: 5
